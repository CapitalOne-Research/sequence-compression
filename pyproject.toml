[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqpack"
version = "0.1.0"
description = "Compress feature sequences into compact JSON-serializable representations, with pandas and PySpark APIs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Capital One" }]
keywords = ["compression", "serialization", "feature-engineering", "pandas", "pyspark"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "scipy>=1.11.0",
]

[project.urls]
Homepage = "https://github.com/CapitalOne-Research/sequence-compression"
Repository = "https://github.com/CapitalOne-Research/sequence-compression"
Issues = "https://github.com/CapitalOne-Research/sequence-compression/issues"
Documentation = "https://github.com/CapitalOne-Research/sequence-compression#readme"
Changelog = "https://github.com/CapitalOne-Research/sequence-compression/blob/main/CHANGELOG.md"

[project.optional-dependencies]
spark = ["pyspark>=3.5.0"]
web = ["tornado>=6.4"]
benchmark = ["plotly>=5.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
    "plotly>=5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["seqpack*"]

[tool.setuptools.package-data]
seqpack = ["py.typed", "utils/_codebook_cache.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["seqpack"]
omit = ["*/spark_udfs.py", "*/spark_feature_encode.py", "*/spark_feature_decode.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "NPY"]
ignore = [
    "E501",   # formatter owns line width
    "B008",   # call-in-default is fine in this codebase
    "SIM108", # ternary-instead-of-if hurts readability in a couple of places
]

[tool.ruff.lint.isort]
known-first-party = ["seqpack"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["seqpack"]
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
pretty = true

[[tool.mypy.overrides]]
module = ["pyspark.*", "plotly.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["seqpack.utils.spark_udfs", "seqpack.encoding.spark_feature_encode", "seqpack.decoding.spark_feature_decode"]
disable_error_code = ["misc", "no-any-return", "no-redef", "used-before-def"]
