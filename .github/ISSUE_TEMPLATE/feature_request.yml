name: Feature request
description: Suggest an idea for seqpack
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do, and how does the current API fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        What would you like to see? If you're proposing a new encoding
        scheme, note the data shape it targets and roughly how it compresses.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any existing schemes/pipelines or workarounds you've tried.
      required: false
